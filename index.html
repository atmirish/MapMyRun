<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d3fd1">
<title>MapMyRun</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed map, one bottom sheet holding the controls, search pill floating at top. */
:root{
  --bg:#f3f4f7; --sheet:#ffffff; --fg:#141824; --muted:#5d6577; --line:#e1e4ec;
  --accent:#1d3fd1; --accent-ink:#ffffff; --accent-soft:#e6ebff; --pin:#ff5a1f; --warn:#b4231a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 -8px 30px rgba(20,24,36,.12);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1118; --sheet:#171b25; --fg:#eef0f6; --muted:#9aa2b5; --line:#2a3040;
  --accent:#6f8bff; --accent-ink:#0b0e16; --accent-soft:#222b4a; --pin:#ff7a45; --warn:#ff8a80;
  --shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);overflow:hidden}
#map{position:fixed;inset:0;background:var(--bg)}
@media (prefers-color-scheme: dark){.leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.85) contrast(.9) saturate(.6)}}

.top{position:fixed;z-index:500;top:calc(env(safe-area-inset-top,0px) + 12px);
  left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;gap:8px}
.search{flex:1;min-width:0;display:flex;background:var(--sheet);border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;padding:12px 16px;outline:none}
.round{width:46px;height:46px;flex:none;border:0;border-radius:999px;background:var(--sheet);color:var(--fg);
  box-shadow:0 4px 16px rgba(0,0,0,.15);display:grid;place-items:center;cursor:pointer}
.round svg{width:22px;height:22px}
.round[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.zonebar{position:fixed;z-index:600;top:calc(env(safe-area-inset-top,0px) + 66px);
  left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto;
  background:var(--sheet);border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:8px 8px 8px 14px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.zonebar[hidden],#resultBox[hidden]{display:none}
.zonebar span{flex:1;min-width:140px}
.zonefind{display:flex;gap:6px;flex-basis:100%;min-width:0}
.zonefind input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);font:inherit;padding:6px 10px}
#zoneOffer{justify-self:start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:7px 14px;font:600 14px var(--body);cursor:pointer}
#zoneOffer[hidden]{display:none}
.zonebar button{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:6px 10px;font:600 13px var(--body);cursor:pointer}
.zonebar button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.sheet{position:fixed;z-index:500;left:0;right:0;bottom:0;background:var(--sheet);box-shadow:var(--shadow);
  border-radius:18px 18px 0 0;padding:6px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:grid;gap:8px;max-width:560px;margin:0 auto}
.grab{justify-self:center;border:0;background:transparent;padding:6px 24px;cursor:pointer}.grab::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line)}
.sheet.min .ctrl{display:none}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.dist{display:flex;align-items:center;gap:10px}.dist .label{flex:1}
.dist .num{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;min-width:84px;text-align:center;font-variant-numeric:tabular-nums}
.dist .num small{font-size:15px;color:var(--muted);margin-left:4px}
.step{width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:22px;line-height:1;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:5px 11px;font:600 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;flex:1;min-width:0}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 6px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pace{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.pace input{width:54px;padding:5px!important;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);font:600 15px var(--body);padding:7px 8px;text-align:center}

.go{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 18px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:11px;cursor:pointer}
.go:disabled{opacity:.6;cursor:progress}
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.result div{display:grid}
.result b{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px}
.actions a,.actions button{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--fg);font:600 14px var(--body);padding:8px;cursor:pointer}
.msg{font-size:14px;color:var(--muted);min-height:1.2em}
/* live run */
.runpanel{display:grid;gap:10px}
.runpanel[hidden]{display:none}
.runstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.runstats .big{grid-column:1/-1;font:700 52px/1 var(--display);font-variant-numeric:tabular-nums;text-align:center}
.runstats div{display:grid}
.runstats b{font:700 24px var(--display);font-variant-numeric:tabular-nums}
.runbtns{display:flex;gap:8px}
.runbtns button{flex:1;border-radius:12px;padding:12px;font:700 16px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg)}
.runbtns .stop{background:var(--warn);border-color:var(--warn);color:#fff}
.sheet.running > :not(.runpanel){display:none!important}
body.running .search,body.running #zoneBtn{visibility:hidden}
.me{width:20px!important;height:20px!important;margin:-10px 0 0 -10px!important;border-radius:50%;background:#16a34a;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.me::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid #16a34a;opacity:0;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.me::after{animation:none}}
.msg.err{color:var(--warn)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.km{background:var(--sheet);color:var(--fg);border:2px solid var(--accent);border-radius:999px;font:700 11px/16px var(--body);text-align:center;width:22px!important;height:22px!important;margin:-11px 0 0 -11px!important}
.startpin{width:22px!important;height:22px!important;margin:-11px 0 0 -11px!important;border-radius:50%;background:var(--pin);border:4px solid #fff;box-shadow:0 0 0 6px rgba(255,90,31,.25)}
.leaflet-control-attribution{font-size:10px}
.leaflet-bottom{bottom:var(--sheet-h,300px)}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <form class="search" id="searchForm">
    <input id="q" type="search" placeholder="Start somewhere else…" aria-label="Search for a start point" autocomplete="off">
  </form>
  <button class="round" id="zoneBtn" aria-pressed="false" aria-label="Set a zone to stay inside" title="Stay inside a zone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7l6-3 8 3 2 9-7 4-8-3z" stroke-dasharray="3 2.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
  </button>
  <button class="round" id="locate" aria-label="Use my location" title="Use my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</div>
<div class="zonebar" id="zoneBar" hidden>
  <span id="zoneHint">Tap the map to outline your zone.</span>
  <form class="zonefind" id="zoneFind"><input id="zoneQ" type="search" placeholder="Or type a park or estate, e.g. Marlay Park" aria-label="Park or estate name" autocomplete="off"><button class="primary">Use outline</button></form>
  <button id="zoneUndo">Undo</button>
  <button id="zoneClear">Remove zone</button>
  <button id="zoneDone" class="primary">Done</button>
</div>

<section class="sheet" id="sheet">
  <button class="grab" id="grab" aria-label="Show or hide options"></button>
  <div class="dist ctrl">
    <span class="label">How far?</span>
    <button class="step" id="minus" aria-label="Shorter">−</button>
    <div class="num"><span id="distVal">5</span><small id="unitLbl">km</small></div>
    <button class="step" id="plus" aria-label="Longer">+</button>
  </div>
  <div class="chips ctrl" id="chips"></div>
  <div class="row ctrl">
    <div class="seg" role="group" aria-label="Route shape">
      <button id="mLoop" aria-pressed="true">Loop</button>
      <button id="mOut" aria-pressed="false">Out &amp; back</button>
    </div>
    <div class="seg" role="group" aria-label="Units" style="flex:0 0 90px">
      <button id="uKm" aria-pressed="true">km</button>
      <button id="uMi" aria-pressed="false">mi</button>
    </div>
    <label class="pace" for="pace">Pace <input id="pace" value="6:00" inputmode="numeric"> <span id="paceUnit">/km</span></label>
  </div>
  <button class="go" id="go">Map my run</button>
  <div class="msg" id="msg" role="status">Finding you…</div>
  <button id="zoneOffer" class="ctrl" hidden></button>
  <div id="resultBox" hidden>
    <div class="result">
      <div><span class="label">Route</span><b id="rDist">–</b></div>
      <div><span class="label">Est. time</span><b id="rTime">–</b></div>
      <div><span class="label">Off target</span><b id="rOff">–</b></div>
    </div>
    <div class="actions" style="margin-top:8px">
      <button id="shuffle">New direction</button>
      <a id="gmaps" target="_blank" rel="noopener">Open in Google Maps</a>
    </div>
    <button class="go" id="startRun" style="margin-top:8px;width:100%;background:#16a34a">Start run</button>
  </div>
  <div class="runpanel" id="runPanel" hidden>
    <div class="runstats">
      <div class="big" id="tTime">0:00</div>
      <div><span class="label">Distance</span><b id="tDist">0.00</b></div>
      <div><span class="label">Pace</span><b id="tPace">–</b></div>
      <div><span class="label">To go</span><b id="tLeft">–</b></div>
    </div>
    <div class="msg" id="tMsg" role="status">Waiting for GPS…</div>
    <div class="runbtns"><button id="tPause">Pause</button><button id="tStop" class="stop">Finish</button></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
const ROUTER = "https://routing.openstreetmap.de/routed-foot/route/v1/foot/";
const GEOCODER = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=";
const MI = 1609.344, EARTH = 6371000;

const $ = id => document.getElementById(id);
const store = {get(k,d){try{const v=localStorage.getItem("loop-run:"+k);return v==null?d:JSON.parse(v)}catch{return d}},
               set(k,v){try{localStorage.setItem("loop-run:"+k,JSON.stringify(v))}catch{}}};

const state = {
  dist: store.get("dist",5), unit: store.get("unit","km"), mode: store.get("mode","loop"),
  pace: store.get("pace","6:00"), start: null, bearing: Math.random()*2*Math.PI, route: null,
  zone: store.get("zone", null),  // [[lat,lng],...] polygon the route must stay inside
  longest: !!store.get("zone", null),  // with a zone, default to the biggest clean loop that fits
  zoneRoads: store.get("zoneRoads", null)  // estate name: other named roads count as outside
};

// ---------- map ----------
const map = L.map("map",{zoomControl:false}).setView([53.3498,-6.2603],15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
const startIcon = L.divIcon({className:"startpin"});
let startMarker = null, routeLayer = null, kmLayer = L.layerGroup().addTo(map);

function sheetPad(){ const h=$("sheet").offsetHeight; document.documentElement.style.setProperty("--sheet-h",h+"px"); return h; }
new ResizeObserver(sheetPad).observe($("sheet"));

function setStart(lat,lng,label){
  state.start = {lat,lng};
  if(!startMarker) startMarker = L.marker([lat,lng],{icon:startIcon,draggable:true}).addTo(map)
    .on("dragend",e=>{const p=e.target.getLatLng(); setStart(p.lat,p.lng,"Start moved."); });
  else startMarker.setLatLng([lat,lng]);
  clearRoute();
  map.setView([lat,lng], Math.max(map.getZoom(),16));
  say(label || "Start set. Pick a distance and tap Map my run.");
}
map.on("click", e => {
  if(zoneDraft){ zoneDraft.push([e.latlng.lat, e.latlng.lng]); drawZone(); return; }
  setStart(e.latlng.lat, e.latlng.lng, "Start moved here.");
});

// ---------- zone ----------
let zoneDraft = null, zoneLayer = null;
function drawZone(){
  if(zoneLayer){ map.removeLayer(zoneLayer); zoneLayer=null; }
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  const pts = zoneDraft || state.zone;
  if(pts && pts.length){
    zoneLayer = L.layerGroup().addTo(map);
    if(pts.length>=3) L.polygon(pts,{color:accent,weight:2,dashArray:"6 6",fillColor:accent,fillOpacity:.08,interactive:false}).addTo(zoneLayer);
    else L.polyline(pts,{color:accent,weight:2,dashArray:"6 6",interactive:false}).addTo(zoneLayer);
    if(zoneDraft) pts.forEach(p=>L.circleMarker(p,{radius:5,color:accent,fillColor:"#fff",fillOpacity:1,weight:2,interactive:false}).addTo(zoneLayer));
  }
  if(zoneDraft) $("zoneHint").textContent = zoneDraft.length<3 ? `Tap the map to outline your zone (${zoneDraft.length}/3 points minimum).` : `${zoneDraft.length} points. Keep tapping or press Done.`;
  $("zoneBtn").setAttribute("aria-pressed", String(!!(zoneDraft || state.zone)));
}
function zoneMode(on){
  zoneDraft = on ? [] : null; $("zoneBar").hidden = !on;
  if(startMarker) startMarker.dragging[on?"disable":"enable"]();
  drawZone();
}
$("zoneBtn").onclick = ()=> zoneMode(!zoneDraft);
$("zoneUndo").onclick = ()=>{ if(zoneDraft){ zoneDraft.pop(); drawZone(); } };
$("zoneClear").onclick = ()=>{ state.zone=null; store.set("zone",null); state.zoneRoads=null; store.set("zoneRoads",null); zoneMode(false); clearRoute(); renderDist(); say("Zone removed. Routes can go anywhere."); };
$("zoneDone").onclick = ()=>{
  const d = zoneDraft;
  if(d && d.length>=3){ state.zone=d; store.set("zone",d); state.zoneRoads=null; store.set("zoneRoads",null); state.longest=true; state.mode="loop"; clearRoute(); renderDist(); }
  zoneMode(false);
  if(d && d.length>=3){
    map.fitBounds(L.latLngBounds(d),{paddingTopLeft:[24,80],paddingBottomRight:[24,sheetPad()+24],maxZoom:17});
    say(state.start && !inZone(state.start) ? "Zone saved. Your start is outside it, so tap inside the zone to move it." : "Zone saved. Routes will stay inside it.", state.start && !inZone(state.start));
  } else if(d && d.length) say("A zone needs at least 3 points. Nothing was saved.", true);
};
function inZone(p, poly=state.zone){
  if(!poly) return true;
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const [yi,xi]=poly[i],[yj,xj]=poly[j];
    if(((yi>p.lat)!==(yj>p.lat)) && (p.lng < (xj-xi)*(p.lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
// Waypoints around the inside of the zone: points on its outline, pulled in toward
// the middle by `scale`, visited in order starting from the side nearest the start.
function zoneLoop(start, scale, dir, k=5){
  const c = zoneCentre();
  const a0 = Math.atan2((start.lng-c.lng)*Math.cos(rad(c.lat)), start.lat-c.lat);
  const pts = [start];
  for(let i=1;i<k;i++){
    const edge = clampToZone(offset(c, 5000, a0 + dir*i*2*Math.PI/k), c);
    pts.push({lat:c.lat+(edge.lat-c.lat)*scale, lng:c.lng+(edge.lng-c.lng)*scale});
  }
  pts.push(start);
  return pts;
}
// Pull a waypoint back toward the start until it sits inside the zone.
function clampToZone(p, anchor, keep=0.97){
  if(!state.zone || inZone(p)) return p;
  let lo=0, hi=1;
  for(let i=0;i<14;i++){ const t=(lo+hi)/2, q={lat:anchor.lat+(p.lat-anchor.lat)*t, lng:anchor.lng+(p.lng-anchor.lng)*t}; if(inZone(q)) lo=t; else hi=t; }
  return {lat:anchor.lat+(p.lat-anchor.lat)*lo*keep, lng:anchor.lng+(p.lng-anchor.lng)*lo*keep};
}
function outsideFrac(coords, total){
  if(!state.zone || total<1) return 0;
  let out=0;
  for(let i=1;i<coords.length;i++){ const a=coords[i-1],b=coords[i]; if(!nearZone({lat:(a.lat+b.lat)/2,lng:(a.lng+b.lng)/2})) out+=hav(a,b); }
  return out/total;
}
// Distance in metres from a point to the zone's outline.
function edgeDist(p, poly=state.zone){
  const mx=111320*Math.cos(rad(p.lat)), my=110540; let best=Infinity;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const ax=(poly[j][1]-p.lng)*mx, ay=(poly[j][0]-p.lat)*my, bx=(poly[i][1]-p.lng)*mx, by=(poly[i][0]-p.lat)*my;
    const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
    const t=l2 ? Math.max(0,Math.min(1,-(ax*dx+ay*dy)/l2)) : 0;
    best=Math.min(best, Math.hypot(ax+t*dx, ay+t*dy));
  }
  return best;
}
// Roads drawn along the zone edge count as inside: allow 30 m of slack.
function nearZone(p){ return !state.zone || inZone(p) || edgeDist(p) < 30; }
function zoneCentre(){
  const z=state.zone, c={lat:z.reduce((a,p)=>a+p[0],0)/z.length, lng:z.reduce((a,p)=>a+p[1],0)/z.length};
  if(inZone(c)) return c;
  return {lat:(z[0][0]+z[Math.floor(z.length/2)][0])/2, lng:(z[0][1]+z[Math.floor(z.length/2)][1])/2};
}

function locate(){
  if(!navigator.geolocation){ say("Location isn't available here. Search for a start point or tap the map.",true); return; }
  say("Finding you…");
  navigator.geolocation.getCurrentPosition(
    p => setStart(p.coords.latitude, p.coords.longitude, "Got you. Pick a distance and tap Map my run."),
    () => say("Couldn't get your location. Search for a start point or tap the map.", true),
    {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
}

// ---------- geometry ----------
const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
function offset(p, dist, brg){
  const d = dist/EARTH, la = rad(p.lat), lo = rad(p.lng);
  const la2 = Math.asin(Math.sin(la)*Math.cos(d) + Math.cos(la)*Math.sin(d)*Math.cos(brg));
  const lo2 = lo + Math.atan2(Math.sin(brg)*Math.sin(d)*Math.cos(la), Math.cos(d)-Math.sin(la)*Math.sin(la2));
  return {lat:deg(la2), lng:deg(lo2)};
}
function hav(a,b){
  const dla=rad(b.lat-a.lat), dlo=rad(b.lng-a.lng);
  const h=Math.sin(dla/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dlo/2)**2;
  return 2*EARTH*Math.asin(Math.sqrt(h));
}
// Waypoints for a target "size" (radius for loops, reach for out-and-back).
function waypoints(start, size, brg, mode){
  const anchor = (!state.zone || inZone(start)) ? start : zoneCentre();
  if(mode==="out") return [start, clampToZone(offset(start,size,brg),anchor), start];
  const c = offset(start, size, brg);           // circle centre; start sits on the circle
  const pts = [start];
  for(let k=1;k<4;k++) pts.push(clampToZone(offset(c, size, brg+Math.PI + k*Math.PI/2), anchor));
  pts.push(start);
  return pts;
}

// ---------- routing ----------
async function route(pts){
  const coords = pts.map(p=>p.lng.toFixed(6)+","+p.lat.toFixed(6)).join(";");
  const url = ROUTER+coords+"?overview=full&geometries=geojson&continue_straight=false&steps=true";
  let r = await fetch(url);
  // The free route service asks busy users to slow down: wait a moment and try once more.
  if(r.status===429){ await new Promise(x=>setTimeout(x,1500)); r = await fetch(url); }
  if(!r.ok) throw new Error("router "+r.status);
  const j = await r.json();
  if(j.code!=="Ok" || !j.routes?.length) throw new Error("no route");
  const raw = j.routes[0].geometry.coordinates.map(([x,y])=>({lat:y,lng:x}));
  const clean = state.mode==="loop" ? removeBacktracks(raw, j.routes[0].distance) : raw;
  let d = 0; for(let i=1;i<clean.length;i++) d += hav(clean[i-1],clean[i]);
  // Estate zones: distance on roads with other names (main roads round the edge) counts as outside.
  let foreign = 0;
  if(state.zone && state.zoneRoads){
    const want = state.zoneRoads.toLowerCase(); let tot = 0, bad = 0;
    for(const leg of j.routes[0].legs||[]) for(const st of leg.steps||[]){
      tot += st.distance; const nm = (st.name||"").toLowerCase();
      if(nm && !nm.includes(want)) bad += st.distance;
    }
    foreign = tot ? bad/tot : 0;
  }
  // The stretch from your door out to the loop (and back at the end) is unavoidable,
  // so it doesn't count as doubling back.
  const dense = densify(clean, 5), cum = [0];
  for(let i=1;i<dense.length;i++) cum.push(cum[i-1] + hav(dense[i-1], dense[i]));
  const tot = cum[cum.length-1];
  const at = x => { let lo=0, hi=cum.length-1; while(lo<hi){ const m=(lo+hi)>>1; if(cum[m]<x) lo=m+1; else hi=m; } return dense[lo]; };
  let stem = 0;
  while(stem < tot/2 && hav(at(stem), at(tot-stem)) < 15) stem += 5;
  const overlap = retraceFrac(dense, cum, stem);
  return {distance:d, coords:clean, pts, overlap, outside: Math.max(outsideFrac(clean, d), foreign)};
}

// Share of the route that comes back within 12 m of ground it already covered
// (cul-de-sacs, out-and-backs, side loops). The stretch from your door out to
// the loop and back at the end (`stem` metres) is left out: it can't be avoided.
function retraceFrac(dense, cum, stem){
  const tot = cum[cum.length-1]; if(tot < 1) return 1;
  const CELL = 12, grid = new Map(), mx = 111320*Math.cos(rad(dense[0].lat)), my = 110540;
  const key = (x,y) => x+","+y;
  let again = 0;
  for(let i=0;i<dense.length;i++){
    const p = dense[i], cx = Math.floor(p.lng*mx/CELL), cy = Math.floor(p.lat*my/CELL);
    const counted = cum[i] > stem && cum[i] < tot - stem;
    if(counted && i > 0){
      let hit = false;
      for(let dx=-1;dx<=1 && !hit;dx++) for(let dy=-1;dy<=1 && !hit;dy++){
        for(const j of grid.get(key(cx+dx,cy+dy)) || []){
          if(cum[i]-cum[j] > 60 && hav(p, dense[j]) < 12){ hit = true; break; }
        }
      }
      if(hit) again += cum[i]-cum[i-1];
    }
    const k = key(cx,cy); if(!grid.has(k)) grid.set(k, []); grid.get(k).push(i);
  }
  return again / tot;
}
function densify(c, step){
  const out = [c[0]];
  for(let i=1;i<c.length;i++){ const a=c[i-1], b=c[i], k=Math.max(1, Math.ceil(hav(a,b)/step));
    for(let s=1;s<=k;s++) out.push({lat:a.lat+(b.lat-a.lat)*s/k, lng:a.lng+(b.lng-a.lng)*s/k}); }
  return out;
}
// Share of the route that runs over ground already covered earlier
// (out-and-back stretches, parallel side loops). 0 = perfectly clean loop.
function overlapFrac(coords, total){
  if(total < 1) return 1;
  const CELL = 25, STEP = 10, seen = new Map();
  const lat0 = coords[0].lat, mx = 111320*Math.cos(rad(lat0)), my = 110540;
  let n = 0, over = 0;
  for(let i=1;i<coords.length;i++){
    const a = coords[i-1], b = coords[i], d = hav(a,b), k = Math.max(1, Math.round(d/STEP));
    for(let s=0;s<k;s++){
      const t = s/k, x = (a.lng+(b.lng-a.lng)*t)*mx, y = (a.lat+(b.lat-a.lat)*t)*my;
      const key = Math.floor(x/CELL)+","+Math.floor(y/CELL);
      const last = seen.get(key);
      if(last !== undefined && n-last > 3) over += d/k;   // even a short cul-de-sac counts
      seen.set(key, n); n++;
    }
  }
  return over/total;
}

// Cut out dead-end spurs and small side loops: whenever the path comes back
// within a few metres of a point it passed a short distance earlier, drop
// everything in between. The main loop's return to the start is never cut.
function removeBacktracks(sparse, total){
  // The route service only sends corner points; fill in a point every 5 m so
  // short dead ends can be recognised.
  const coords = [sparse[0]];
  for(let i=1;i<sparse.length;i++){
    const a=sparse[i-1], b=sparse[i], k=Math.max(1, Math.ceil(hav(a,b)/5));
    for(let s=1;s<=k;s++) coords.push({lat:a.lat+(b.lat-a.lat)*s/k, lng:a.lng+(b.lng-a.lng)*s/k});
  }
  const NEAR = 20, maxCut = Math.min(1500, total*0.3), MIN = 25;
  const smallLoop = Math.min(400, total*0.08);   // tiny block circuits get cut too
  const out = [], cum = [];
  const at = d => { let lo=0, hi=cum.length-1; while(lo<hi){ const m=(lo+hi)>>1; if(cum[m]<d) lo=m+1; else hi=m; } return out[lo]; };
  // A true dead end goes out and comes back the same way: points equally far
  // from each end of the stretch sit on top of each other. A real loop does not.
  const isSpur = (j, here, p) => {
    const B = here - cum[j];
    for(const f of [0.2, 0.35, 0.45]){
      const a = at(cum[j] + B*f), bd = here - B*f;
      const b = bd > cum[cum.length-1] ? p : at(bd);
      if(hav(a,b) > NEAR*1.5) return false;
    }
    return true;
  };
  for(const p of coords){
    let cut = -1;
    const here = out.length ? cum[cum.length-1] + hav(out[out.length-1], p) : 0;
    for(let j=out.length-2; j>=0; j--){
      const back = here - cum[j];
      if(back > maxCut) break;
      if(back > MIN && hav(out[j], p) < NEAR && (back < smallLoop || isSpur(j, here, p))) cut = j;
    }
    if(cut >= 0){ out.length = cut+1; cum.length = cut+1; continue; }
    out.push(p); cum.push(here);
  }
  // Never let the clean-up eat most of the route.
  let kept = 0; for(let i=1;i<out.length;i++) kept += hav(out[i-1],out[i]);
  return kept < total*0.4 ? sparse : out;
}

// Points spread along the cleaned route, so Google Maps follows the same path.
function pointsAlong(coords, n){
  let tot=0; const cum=[0];
  for(let i=1;i<coords.length;i++){ tot+=hav(coords[i-1],coords[i]); cum.push(tot); }
  const res=[]; let i=0;
  for(let k=1;k<=n;k++){ const t=tot*k/(n+1); while(cum[i]<t) i++; res.push(coords[i]); }
  return res;
}

async function plan(){
  if(!state.start){ say("Set a start point first: allow location, search, or tap the map.",true); return; }
  let moved = false;
  if(!nearZone(state.start)){
    const s = clampToZone(state.start, zoneCentre(), 0.8);
    setStart(s.lat, s.lng); moved = true;
  }
  const target = state.dist * (state.unit==="km"?1000:MI);
  const go = $("go"); go.disabled = true; go.textContent = "Mapping…";
  // Roads wiggle: start smaller than the ideal circle, then rescale toward the target.
  let size = state.mode==="loop" ? target/(2*Math.PI*1.25) : target/(2*1.25);
  let best = null;
  const loop = state.mode==="loop";
  // Lower is better: distance error plus a heavy penalty for retracing or side loops.
  // Inside a zone a short clean loop can be run as laps, so judge it on laps × length.
  // Only a clean loop is worth repeating; never suggest laps of a dead end.
  const lapsFor = r => (loop && state.zone && r.overlap < 0.12 && r.distance < target*0.9) ? Math.max(1, Math.round(target/r.distance)) : 1;
  const score = r => { const n = lapsFor(r);
    return Math.abs(r.distance*n-target)/target + (loop ? (state.zone ? 5 : 2)*r.overlap : 0) + 6*r.outside + 0.15*(n-1); };
  const keep = r => { if(r && (!best || score(r) < score(best))) best = r; };
  // One failed request shouldn't sink the whole plan: skip it and keep the rest.
  let lastErr = null;
  const tryRoute = async (pts, brg) => { try{ const r = await route(pts); r.brg = brg; return r; }catch(e){ lastErr = e; return null; } };
  const tune = async (brg, tries) => {
    for(let i=0;i<tries;i++){
      const r = await tryRoute(waypoints(state.start,size,brg,state.mode), brg); keep(r);
      if(!r) continue;
      if(Math.abs(r.distance-target)/target < 0.04) return r;
      size *= Math.min(1.8, Math.max(0.5, target/r.distance));
    }
  };
  try{
    if(state.zone && loop){
      // Longest loop: hug the zone's edges with more waypoints; reward length, punish doubling back.
      // Only clean loops (no doubling back, no main roads) compete on length; the
      // fallback score is used only if nothing clean turns up.
      const clean = r => r.overlap < 0.05 && r.outside <= 0.03;   // strict: no cul-de-sac detours
      const lscore = r => 20*r.overlap + 10*r.outside - r.distance/1000;
      let bestClean = null, bestAny = null;
      window.mmrCandidates = [];   // for troubleshooting from the browser console
      for(const k of [8, 6]) for(const sc of [0.9, 0.75, 0.6]) for(const dir of [1,-1]){
        say("Searching for the longest loop in your zone…");
        const r = await tryRoute(zoneLoop(state.start, sc, dir, k), state.bearing);
        if(!r) continue;
        window.mmrCandidates.push({km:+(r.distance/1000).toFixed(2), doubling:+r.overlap.toFixed(2), outside:+r.outside.toFixed(2), k, sc, dir});
        if(clean(r) && (!bestClean || r.distance > bestClean.distance)) bestClean = r;
        if(!bestAny || lscore(r) < lscore(bestAny)) bestAny = r;
      }
      best = bestClean || bestAny;
      if(!best) throw lastErr || new Error("no route");
      // Inside a zone, the longest loop is the route; a set distance just means laps of it.
      // Only when that loop is well over the distance asked for do we plan a shorter one.
      if(state.longest || best.distance <= target*1.15){
        const u = state.unit, conv = u==="km" ? 1000 : MI;
        best.laps = state.longest ? 1 : Math.max(1, Math.round(target/best.distance));
        state.route = best; draw(best, state.longest ? best.distance : target);
        const len = `${(best.distance/conv).toFixed(2)} ${u}`;
        say(!bestClean ? `Longest loop I could find: ${len}. Some of it doubles back or leaves the zone.` :
            best.laps > 1 ? `Longest loop in your zone is ${len}. Run it ${best.laps} times for ${(best.distance*best.laps/conv).toFixed(2)} ${u}. The app counts your laps.` :
            `Longest clean loop in your zone: ${len}.`);
        if(moved) say("You were outside your zone, so the run now starts at the nearest point inside it.");
        return;
      }
      best = null;
    }
    say("Finding the right size…");
    await tune(state.bearing, 3);
    if(loop || state.zone){
      // Try the loop in other directions and keep the cleanest one.
      for(let k=1;k<6;k++){
        say(`Looking for the cleanest loop… (${k}/5)`);
        const brg = state.bearing + k*Math.PI/3;
        keep(await tryRoute(waypoints(state.start,size,brg,state.mode), brg));
      }
      if(state.zone && loop){
        // Loops that follow the zone's own shape, around the inside of the estate or park.
        for(const sc of [0.8, 0.6, 0.4]) for(const dir of [1,-1]){
          say("Looking for a loop around your zone…");
          keep(await tryRoute(zoneLoop(state.start, sc, dir), state.bearing));
        }
        // Also a few tighter circles that may avoid cul-de-sacs.
        const base = size;
        for(let k=0;k<3;k++){
          say("Looking for a clean loop inside your zone…");
          const brg = state.bearing + k*2*Math.PI/3;
          keep(await tryRoute(waypoints(state.start, base*0.5, brg, state.mode), brg));
        }
      }
      if(!best) throw lastErr || new Error("no route");
      if(lapsFor(best)===1 && Math.abs(best.distance-target)/target > 0.05){
        say("Fine-tuning the distance…");
        size *= Math.min(1.8, Math.max(0.5, target/best.distance));
        await tune(best.brg, 2);
      }
      state.bearing = best.brg;
    }
    if(!best) throw lastErr || new Error("no route");
    best.laps = lapsFor(best);
    state.route = best; draw(best, target);
    if(moved) say("You were outside your zone, so the run now starts at the nearest point inside it.");
  }catch(e){
    console.error(e);
    say(e && e.message==="router 429" ? "The route service is busy. Wait a few seconds and tap Map my run again." :
        e && e.message && e.message.startsWith("router") ? "Couldn't reach the route service. Check your connection and try again." :
        e && e.message==="no route" ? "No paths found here. Try moving your start onto a road or path." :
        "Something went wrong planning this run. Try a slightly different start or zone.", true);
  }finally{ go.disabled=false; go.textContent="Map my run"; }
}

function clearRoute(){ if(routeLayer){map.removeLayer(routeLayer);routeLayer=null;} clearRunLayers(); kmLayer.clearLayers(); $("resultBox").hidden=true; state.route=null; }

function draw(r, target){
  clearRoute(); state.route = r;
  $("resultBox").hidden = false; $("sheet").classList.add("min");
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  routeLayer = L.layerGroup([
    L.polyline(r.coords,{color:"#fff",weight:9,opacity:.9}),
    L.polyline(r.coords,{color:accent,weight:5})
  ]).addTo(map);
  // markers every km / mile
  const step = state.unit==="km"?1000:MI; let acc=0, next=step, n=1;
  for(let i=1;i<r.coords.length;i++){
    const a=r.coords[i-1], b=r.coords[i], d=hav(a,b);
    while(acc+d>=next && next < r.distance-step*0.3){
      const t=(next-acc)/d;
      L.marker([a.lat+(b.lat-a.lat)*t, a.lng+(b.lng-a.lng)*t],{icon:L.divIcon({className:"km",html:n}),interactive:false}).addTo(kmLayer);
      n++; next+=step;
    }
    acc+=d;
  }
  map.fitBounds(L.latLngBounds(r.coords),{paddingTopLeft:[24,80],paddingBottomRight:[24,sheetPad()+24],maxZoom:17});
  const u = state.unit, conv = u==="km"?1000:MI;
  const nl = r.laps || 1, full = r.distance*nl;
  $("rDist").textContent = (r.distance/conv).toFixed(2)+" "+u + (nl>1 ? ` × ${nl}` : "");
  const secs = paceSecs()*full/conv;
  $("rTime").textContent = secs ? fmtTime(secs) : "–";
  const off = (full-target)/conv;
  $("rOff").textContent = (off>=0?"+":"−")+Math.abs(off).toFixed(2);
  $("gmaps").href = gmapsLink(r);
  $("resultBox").hidden = false;
  $("sheet").classList.add("min");
  say(Math.abs(off*conv)/target < 0.08 ? "Here's your run. Not keen? Try a new direction." :
      "Closest route I could find around here. Try a new direction for another option.");
  if(nl>1) say(`Run this loop ${nl} times for ${(full/conv).toFixed(2)} ${u}. The app counts your laps.`);
  else if(state.zone && r.outside <= 0.02 && r.distance < target*0.85) say(`Your zone is too small for ${state.dist} ${state.unit}. This is the longest clean loop that fits inside it.`);
  if(r.outside > 0.02) say(`About ${Math.round(r.outside*100)}% of this route leaves your zone. Try a shorter run or a bigger zone.`, true);
}

function gmapsLink(r){
  const f = p=>p.lat.toFixed(6)+","+p.lng.toFixed(6);
  const mid = (state.mode==="out" ? r.pts.slice(1,-1) : pointsAlong(r.coords,6)).map(f).join("|");
  return `https://www.google.com/maps/dir/?api=1&origin=${f(r.pts[0])}&destination=${f(r.pts[0])}&waypoints=${encodeURIComponent(mid)}&travelmode=walking`;
}

// ---------- pace & formatting ----------
function paceSecs(){ const m=/^(\d{1,2}):(\d{2})$/.exec(state.pace.trim()); return m? (+m[1])*60+(+m[2]) : 0; }
function fmtTime(s){ s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h? `${h}h ${String(m).padStart(2,"0")}m` : `${m} min`; }
function say(t,err){ const m=$("msg"); m.textContent=t; m.classList.toggle("err",!!err); }

// ---------- controls ----------
const PRESETS = {km:[3,5,8,10,15,21.1], mi:[2,3,5,6.2,10,13.1]};
function renderDist(){
  if(!state.zone) state.longest = false;
  $("distVal").textContent = state.longest ? "Max" : +state.dist.toFixed(1);
  $("unitLbl").textContent = state.longest ? "" : state.unit; $("paceUnit").textContent = "/"+state.unit;
  $("chips").innerHTML = "";
  $("distVal").title = state.zone ? "Tap for the longest loop in your zone" : "";
  PRESETS[state.unit].forEach(v=>{
    const b=document.createElement("button"); b.className="chip"; b.textContent=v+" "+state.unit;
    b.setAttribute("aria-pressed", String(!state.longest && Math.abs(v-state.dist)<0.01));
    b.onclick=()=>{state.dist=v; state.longest=false; changed();}; $("chips").appendChild(b);
  });
  $("mLoop").setAttribute("aria-pressed",String(state.mode==="loop"));
  $("mOut").setAttribute("aria-pressed",String(state.mode==="out"));
  $("uKm").setAttribute("aria-pressed",String(state.unit==="km"));
  $("uMi").setAttribute("aria-pressed",String(state.unit==="mi"));
}
function changed(){ store.set("dist",state.dist); store.set("unit",state.unit); store.set("mode",state.mode); renderDist(); if(state.route) clearRoute(); }
$("minus").onclick=()=>{ state.longest=false; state.dist=Math.max(1, Math.round((state.dist-(state.dist>10?1:0.5))*2)/2); changed(); };
$("plus").onclick =()=>{ state.longest=false; state.dist=Math.min(50, Math.round((state.dist+(state.dist>=10?1:0.5))*2)/2); changed(); };
$("mLoop").onclick=()=>{state.mode="loop";changed();};
$("mOut").onclick =()=>{state.mode="out"; state.longest=false; changed();};
$("uKm").onclick=()=>{ if(state.unit!=="km"){state.unit="km"; state.dist=Math.round(state.dist*MI/1000*2)/2; changed();} };
$("uMi").onclick=()=>{ if(state.unit!=="mi"){state.unit="mi"; state.dist=Math.round(state.dist*1000/MI*2)/2; changed();} };
$("pace").value = state.pace;
$("pace").onchange=e=>{ state.pace=e.target.value; store.set("pace",state.pace); if(state.route) draw(state.route, state.dist*(state.unit==="km"?1000:MI)); };
$("go").onclick = plan;
// With a zone, tapping the distance switches back to the longest loop.
$("distVal").onclick = ()=>{ if(state.zone && !state.longest){ state.longest=true; state.mode="loop"; changed(); } };
$("grab").onclick = ()=>{ $("sheet").classList.toggle("min"); };
$("shuffle").onclick = ()=>{ state.bearing = (state.bearing + Math.PI*(0.5+Math.random())) % (2*Math.PI); plan(); };
$("locate").onclick = ()=>{ if(run.on){ run.follow=true; if(run.last) map.panTo(run.last); return; } locate(); };

// ---------- live run ----------
const DONE = "#16a34a";
const run = {on:false, paused:false, watch:null, t0:0, acc:0, dist:0, last:null, recent:[], lock:null, follow:true, idx:0, track:null, laps:0};
let meMarker=null, traceLine=null, doneLine=null, todoLine=null, runTimer=null, finishArmed=0;
const unitM = () => state.unit==="km" ? 1000 : MI;
function clearRunLayers(){ if(run.on) return; [traceLine,doneLine,todoLine,meMarker].forEach(l=>l&&map.removeLayer(l)); traceLine=doneLine=todoLine=meMarker=null; }
function fmtClock(s){ s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=String(s%60).padStart(2,"0"); return h ? `${h}:${String(m).padStart(2,"0")}:${x}` : `${m}:${x}`; }
function tMsg(t, err){ const m=$("tMsg"); m.textContent=t; m.classList.toggle("err",!!err); }
// The planned route, densified every 10 m, so progress can be measured along it.
function buildTrack(){
  const c = state.route && state.route.coords; if(!c || c.length<2) return null;
  const pts=[c[0]], cum=[0];
  for(let i=1;i<c.length;i++){ const a=c[i-1], b=c[i], d=hav(a,b), k=Math.max(1,Math.ceil(d/10));
    for(let s=1;s<=k;s++){ const p={lat:a.lat+(b.lat-a.lat)*s/k, lng:a.lng+(b.lng-a.lng)*s/k}; cum.push(cum[cum.length-1]+hav(pts[pts.length-1],p)); pts.push(p); } }
  return {pts, cum, total:cum[cum.length-1], laps: state.route.laps || 1};
}
// Route colours: done = green, still to run = blue.
function paintProgress(){
  const t = run.track; if(!t) return;
  const done = t.pts.slice(0, run.idx+1), todo = t.pts.slice(run.idx);
  doneLine.setLatLngs(done); todoLine.setLatLngs(todo);
}
async function keepAwake(){ try{ if(navigator.wakeLock) run.lock = await navigator.wakeLock.request("screen"); }catch{} }
document.addEventListener("visibilitychange", ()=>{ if(run.on && document.visibilityState==="visible") keepAwake(); });
map.on("dragstart", ()=>{ if(run.on) run.follow=false; });

function startRun(){
  if(!navigator.geolocation){ say("This browser can't track your location.", true); return; }
  clearRunLayers();
  Object.assign(run,{on:true, paused:false, t0:Date.now(), acc:0, dist:0, last:null, recent:[], follow:true, idx:0, laps:0, lap:1, track:buildTrack()});
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  if(routeLayer){ map.removeLayer(routeLayer); routeLayer=null; }
  todoLine = L.polyline([], {color:accent, weight:6, opacity:.9}).addTo(map);
  doneLine = L.polyline([], {color:DONE, weight:7}).addTo(map);
  traceLine = L.polyline([], {color:DONE, weight:3, dashArray:"2 6", opacity:.8}).addTo(map);
  paintProgress();
  document.body.classList.add("running"); $("sheet").classList.add("running"); $("sheet").classList.remove("min");
  $("runPanel").hidden=false; $("tPause").textContent="Pause"; $("tStop").textContent="Finish";
  $("tDist").textContent="0.00"; $("tPace").textContent="–"; $("tLeft").textContent = run.track ? (run.track.total*run.track.laps/unitM()).toFixed(2) : "–";
  tMsg("Waiting for GPS…");
  run.watch = navigator.geolocation.watchPosition(onFix,
    ()=>tMsg("Can't get your location. Allow location for this site in your browser settings.", true),
    {enableHighAccuracy:true, maximumAge:0, timeout:20000});
  runTimer = setInterval(()=>{ $("tTime").textContent = fmtClock(elapsed()/1000); }, 1000);
  $("tTime").textContent="0:00";
  keepAwake();
}
function elapsed(){ return run.acc + (run.paused ? 0 : Date.now()-run.t0); }
function onFix(pos){
  const c = pos.coords, p = {lat:c.latitude, lng:c.longitude}, now = pos.timestamp || Date.now();
  if(!meMarker){ meMarker = L.marker(p,{icon:L.divIcon({className:"me"}), interactive:false, zIndexOffset:1000}).addTo(map); map.setView(p, Math.max(map.getZoom(),17)); }
  else meMarker.setLatLng(p);
  if(run.follow) map.panTo(p, {animate:true});
  if(run.paused) return;
  if(c.accuracy > 40){ tMsg(`Weak GPS signal (±${Math.round(c.accuracy)} m). Hold on…`); return; }
  if(run.last){
    const d = hav(run.last, p), dt = (now-run.last.t)/1000;
    if(d < 3) return;                       // standing still / GPS jitter
    if(dt > 0 && d/dt > 9) return;          // impossible jump
    run.dist += d;
  }
  run.last = {...p, t:now};
  traceLine.addLatLng(p);
  run.recent.push({t:now, d:run.dist});
  while(run.recent.length>2 && now-run.recent[0].t > 30000) run.recent.shift();
  const u = unitM(), laps = Math.floor(run.dist/u);
  if(laps > run.laps){ run.laps = laps; try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch{} }
  $("tDist").textContent = (run.dist/u).toFixed(2);
  const r0 = run.recent[0], dd = run.dist - r0.d, dts = (now - r0.t)/1000;
  $("tPace").textContent = (dts >= 10 && dd > 15) ? fmtClock(dts/dd*u) : "–";
  // Progress along the planned route
  const t = run.track;
  if(t){
    let best = run.idx, bd = Infinity;
    const lo = Math.max(0, run.idx-10), hi = Math.min(t.pts.length-1, run.idx + Math.min(300, Math.floor(t.pts.length*0.4)));
    for(let i=lo;i<=hi;i++){ const d=hav(p,t.pts[i]); if(d<bd){ bd=d; best=i; } }
    if(bd < 50){
      run.idx = Math.max(run.idx, best);
      // Lap finished: start colouring the loop again from the beginning.
      let lapNote = "";
      if(t.laps > 1 && run.lap < t.laps && t.total - t.cum[run.idx] < 30){ run.lap++; run.idx = 0; lapNote = `Lap ${run.lap-1} done! Starting lap ${run.lap} of ${t.laps}. `; }
      paintProgress();
      const left = Math.max(0, t.total - t.cum[run.idx]) + (t.laps - run.lap)*t.total;
      $("tLeft").textContent = (left/u).toFixed(2);
      const lapTxt = t.laps > 1 ? `Lap ${run.lap} of ${t.laps}. ` : "";
      tMsg(lapNote || (left < 30 ? "You're back at the start. Tap Finish when you're done." : lapTxt + (run.laps ? `${run.laps} ${state.unit} done. On route.` : "On route. Keep going!")));
    } else tMsg(`You're ${Math.round(bd)} m off the route. Head back to the blue line.`, true);
  } else tMsg(run.laps ? `${run.laps} ${state.unit} done.` : "Tracking your run.");
}
function pauseRun(){
  if(run.paused){ run.paused=false; run.t0=Date.now(); run.last=null; run.recent=[]; $("tPause").textContent="Pause"; tMsg("Running again."); }
  else { run.acc += Date.now()-run.t0; run.paused=true; $("tPause").textContent="Resume"; tMsg("Paused. Your time has stopped."); }
}
function finishRun(){
  if(Date.now()-finishArmed > 3000){
    finishArmed = Date.now(); $("tStop").textContent = "Tap again to finish";
    setTimeout(()=>{ if(run.on) $("tStop").textContent="Finish"; }, 3000); return;
  }
  if(run.watch!=null) navigator.geolocation.clearWatch(run.watch);
  clearInterval(runTimer); try{ run.lock && run.lock.release(); }catch{}
  const secs = elapsed()/1000, u = unitM();
  run.on = false;
  const runs = store.get("runs", []); runs.unshift({date:new Date().toISOString(), meters:Math.round(run.dist), secs:Math.round(secs)}); store.set("runs", runs.slice(0,30));
  document.body.classList.remove("running"); $("sheet").classList.remove("running"); $("runPanel").hidden=true;
  const avg = run.dist > 50 ? `, average pace ${fmtClock(secs/(run.dist/u))} /${state.unit}` : "";
  say(`Run finished: ${(run.dist/u).toFixed(2)} ${state.unit} in ${fmtClock(secs)}${avg}. Nice work!`);
}
$("startRun").onclick = startRun;
$("tPause").onclick = pauseRun;
$("tStop").onclick = finishRun;
// ---------- outlines of parks and estates (from OpenStreetMap) ----------
const OUTLINE = "&polygon_geojson=1&polygon_threshold=0.00003";
function ringArea(r){ let a=0; for(let i=0,j=r.length-1;i<r.length;j=i++) a += (r[j][0]+r[i][0])*(r[j][1]-r[i][1]); return Math.abs(a)/2; }
// Largest outer ring of a place's outline, as [[lat,lng],...]; null for points and roads.
function outlineOf(g){
  if(!g) return null;
  const rings = g.type==="Polygon" ? [g.coordinates[0]] : g.type==="MultiPolygon" ? g.coordinates.map(p=>p[0]) : [];
  if(!rings.length) return null;
  rings.sort((a,b)=>ringArea(b)-ringArea(a));
  return rings[0].map(([x,y])=>[y,x]);
}
// Rough size in km² so a whole city or county isn't offered as a zone.
function kmArea(ring){ const lat=rad(ring[0][0]); return ringArea(ring)*111.32*111.32*Math.cos(lat); }
const usable = ring => ring && kmArea(ring) > 0.01 && kmArea(ring) < 25;
let offered = null;
// Estates: the mapped outline often leaves out some of the estate's own roads, so also
// fetch every road with the estate's name and wrap the zone around all of it.
function hull(pts){
  const p = pts.map(([a,b])=>[b,a]).sort((u,v)=>u[0]-v[0]||u[1]-v[1]);
  const cross = (o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[], up=[];
  for(const q of p){ while(lo.length>=2 && cross(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q); }
  for(const q of p.slice().reverse()){ while(up.length>=2 && cross(up[up.length-2],up[up.length-1],q)<=0) up.pop(); up.push(q); }
  return lo.slice(0,-1).concat(up.slice(0,-1)).map(([x,y])=>[y,x]);
}
// Push an outline out by `m` metres so roads on its edge sit inside it.
function grow(ring, m){
  const c = {lat:ring.reduce((a,p)=>a+p[0],0)/ring.length, lng:ring.reduce((a,p)=>a+p[1],0)/ring.length};
  return ring.map(([la,ln])=>{ const d = hav(c,{lat:la,lng:ln}) || 1, k = (d+m)/d; return [c.lat+(la-c.lat)*k, c.lng+(ln-c.lng)*k]; });
}
const isEstate = place => !!place && /^(landuse|place)$/.test(place.class);
async function estateOutline(ring, place){
  if(!isEstate(place)) return ring;   // parks keep their exact shape
  const name = place.display_name.split(",")[0].replace(/["\\]/g,"");
  const lats = ring.map(p=>p[0]), lngs = ring.map(p=>p[1]), pad = 0.003;
  const box = [Math.min(...lngs)-pad, Math.max(...lats)+pad, Math.max(...lngs)+pad, Math.min(...lats)-pad].join(",");
  const ac = new AbortController(); const timer = setTimeout(()=>ac.abort(), 8000);
  try{
    // dedupe=0 returns every separate road with this name, not just one.
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=40&dedupe=0&bounded=1&polygon_geojson=1&viewbox=${box}&q=${encodeURIComponent(name)}`;
    const j = await (await fetch(url, {signal:ac.signal})).json();
    const pts = j.filter(x=>x.class==="highway" && x.geojson).flatMap(x=>{
      const g = x.geojson, lines = g.type==="LineString" ? [g.coordinates] : g.type==="MultiLineString" ? g.coordinates : [];
      return lines.flat().map(([ln,la])=>[la,ln]);
    });
    clearTimeout(timer);
    return grow(hull(ring.concat(pts)), 25);
  }catch{ return grow(ring, 25); }
}
function applyZone(ring, name, roads=null){
  state.zone = ring; store.set("zone", ring); state.zoneRoads = roads; store.set("zoneRoads", roads); state.longest = true; state.mode = "loop"; clearRoute(); renderDist();
  if(zoneDraft) zoneMode(false); else drawZone();
  $("zoneOffer").hidden = true;
  map.fitBounds(L.latLngBounds(ring),{paddingTopLeft:[24,80],paddingBottomRight:[24,sheetPad()+24],maxZoom:17});
  say(`Zone set to ${name}. Routes will stay inside it.` + (state.start && !nearZone(state.start) ? " Your start is outside it, so the run will begin at its edge." : ""));
}
$("zoneFind").onsubmit = async e=>{
  e.preventDefault(); const q=$("zoneQ").value.trim(); if(!q) return;
  $("zoneHint").textContent = "Looking up the outline…";
  try{
    const j = await (await fetch(GEOCODER.replace("limit=1","limit=5")+encodeURIComponent(q)+OUTLINE)).json();
    const hit = j.map(x=>({x, ring:outlineOf(x.geojson)})).find(h=>usable(h.ring));
    if(!hit){ $("zoneHint").textContent = `Couldn't find an outline for "${q}". Tap the map to draw your zone instead.`; return; }
    $("zoneQ").value=""; $("zoneQ").blur();
    const nm = hit.x.display_name.split(",")[0];
    applyZone(await estateOutline(hit.ring, hit.x), nm, isEstate(hit.x) ? nm : null);
  }catch{ $("zoneHint").textContent = "Couldn't look that up right now. Tap the map to draw your zone instead."; }
};
$("zoneOffer").onclick = async ()=>{
  if(!offered) return; const o = offered;
  say(`Loading the outline of ${o.name}…`);
  applyZone(await estateOutline(o.ring, o.place), o.name, isEstate(o.place) ? o.name : null);
};

$("searchForm").onsubmit = async e=>{
  e.preventDefault(); const q=$("q").value.trim(); if(!q) return;
  say("Searching…"); $("zoneOffer").hidden = true; offered = null;
  try{ const r=await fetch(GEOCODER+encodeURIComponent(q)+OUTLINE); const j=await r.json();
    if(!j.length) return say(`Couldn't find "${q}". Try a street, park or town name.`,true);
    $("q").blur(); setStart(+j[0].lat, +j[0].lon, "Start set to "+j[0].display_name.split(",").slice(0,2).join(",")+".");
    // Searched a park or estate? Offer to keep the run inside it.
    const ring = outlineOf(j[0].geojson);
    if(usable(ring)){ offered = {ring, name:j[0].display_name.split(",")[0], place:j[0]}; $("zoneOffer").textContent = `Stay inside ${offered.name}`; $("zoneOffer").hidden = false; }
  }catch{ say("Search isn't reachable right now. Tap the map to set a start instead.",true); }
};

renderDist(); sheetPad(); drawZone(); locate();
})();
</script>
